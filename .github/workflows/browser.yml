name: Browser connectivity feasibility
on:
  pull_request:
    paths:
      - 'crates/locho-core/**'
      - 'crates/locho-web/**'
      - 'packages/locho-web/**'
      - '.github/workflows/browser.yml'
  push:
    branches: [main]
    paths:
      - 'crates/locho-core/**'
      - 'crates/locho-web/**'
      - 'packages/locho-web/**'
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Metadata soak duration per browser/context (1–3600 seconds)
        default: '900'
        required: true
        type: string
permissions:
  contents: read
jobs:
  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: packages/locho-web/package-lock.json
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: cargo build --locked --release --bin locho
      - run: cargo build --locked --release -p locho-web --target wasm32-unknown-unknown
      - run: npm ci
        working-directory: packages/locho-web
      - run: npm run build:wasm
        working-directory: packages/locho-web
      - run: npm run build
        working-directory: packages/locho-web
      - run: npm run build:package
        working-directory: packages/locho-web
      - run: npm run build:production
        working-directory: packages/locho-web
      - uses: actions/checkout@v7
        with:
          repository: trchopan/locho_sdk_examples
          ref: 75a93b3f50900becc320d50c2ecf2dc662292141
          path: target/reference-api
          persist-credentials: false
      - run: npm run sdk:setup && npm ci && npm run build
        working-directory: target/reference-api
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/locho-web
      - name: Browser regression and metadata smoke
        run: npm run test:browser
        working-directory: packages/locho-web
        env:
          LOCHO_N0_INTEGRATION: '1'
          LOCHO_HOST_BINARY: ${{ github.workspace }}/target/release/locho
          LOCHO_N0_FIXTURE_FILE: ${{ runner.temp }}/locho-web-n0-fixture.json
          LOCHO_REFERENCE_API: ${{ github.workspace }}/target/reference-api
      - run: npm run test:external
        working-directory: packages/locho-web
        env:
          LOCHO_N0_INTEGRATION: '1'
          LOCHO_HOST_BINARY: ${{ github.workspace }}/target/release/locho
          LOCHO_N0_FIXTURE_FILE: ${{ runner.temp }}/locho-web-external-fixture.json
          LOCHO_REFERENCE_API: ${{ github.workspace }}/target/reference-api
      - uses: actions/upload-artifact@v7
        with:
          name: locho-web-npm-package
          path: packages/locho-web/dist/artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: locho-web-wasm-proof
          path: packages/locho-web/src/generated
      - name: Upload soak runtime
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: locho-web-soak-runtime
          path: |
            target/release/locho
            packages/locho-web/dist/browser

  metadata-soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: packages/locho-web/package-lock.json
      - uses: actions/download-artifact@v7
        with:
          name: locho-web-soak-runtime
      - run: chmod +x target/release/locho
      - run: npm ci
        working-directory: packages/locho-web
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: packages/locho-web
      - name: Sustained metadata sessions in pages and module service workers
        run: npm run test:soak
        working-directory: packages/locho-web
        env:
          LOCHO_N0_INTEGRATION: '1'
          LOCHO_HOST_BINARY: ${{ github.workspace }}/target/release/locho
          LOCHO_N0_FIXTURE_FILE: ${{ runner.temp }}/locho-metadata-soak-fixture.json
          LOCHO_SOAK_SECONDS: ${{ inputs.soak_seconds || '900' }}
      - name: Upload credential-free soak diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: locho-web-metadata-soak
          path: |
            packages/locho-web/test-results/soak
            packages/locho-web/test-results/soak-results.json
          if-no-files-found: warn
