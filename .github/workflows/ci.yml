name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      stress_duration:
        description: Native Unix stress duration (for example, 5m)
        required: true
        default: 5m
      soak_duration:
        description: Native Unix soak duration (for example, 15m)
        required: true
        default: 15m

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint, and test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      LOCHO_EXPECTED_COMMIT: ${{ github.sha }}
      LOCHO_EXPECTED_DIRTY: clean
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Python for Unix stream smoke tests
        if: runner.os != 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Test performance harnesses
        if: runner.os != 'Windows'
        run: |
          python3 -m unittest discover -s tests/perf -p test_unix_streams.py -v
          python3 -m unittest discover -s tests/perf/loadgen -p test_loadgen.py -v

      - name: Run Unix CI verification gate
        if: runner.os != 'Windows'
        run: scripts/verify-ci.sh

      - name: Run Windows CI verification gate
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\Verify-CI.ps1

  native-stress:
    name: Native Unix stress (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build release binary
        run: cargo build --release

      - name: Run native Unix stress profile
        env:
          LOCHO_STRESS_DURATION: ${{ github.event.inputs.stress_duration || '5m' }}
        run: python3 tests/perf/unix_streams.py stress --binary target/release/locho --duration "$LOCHO_STRESS_DURATION"

      - name: Upload stress artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unix-stress-${{ matrix.os }}
          path: artifacts/unix-stress-*
          if-no-files-found: warn

  native-soak:
    name: Native Unix soak (${{ matrix.os }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Build release binary
        run: cargo build --release

      - name: Run native Unix soak profile
        env:
          LOCHO_SOAK_DURATION: ${{ github.event.inputs.soak_duration || '15m' }}
        run: python3 tests/perf/unix_streams.py soak --binary target/release/locho --duration "$LOCHO_SOAK_DURATION"

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unix-soak-${{ matrix.os }}
          path: artifacts/unix-soak-*
          if-no-files-found: warn

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    env:
      LOCHO_EXPECTED_COMMIT: ${{ github.sha }}
      LOCHO_EXPECTED_DIRTY: clean
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run MSRV verification
        run: scripts/verify-ci.sh

  artifact-smoke:
    name: Packaged artifact smoke (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      LOCHO_EXPECTED_COMMIT: ${{ github.sha }}
      LOCHO_EXPECTED_DIRTY: clean
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Python for local artifact server
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install cargo-dist
        run: cargo install cargo-dist --version 0.32.0 --locked

      - name: Determine native target
        id: host
        shell: bash
        run: |
          echo "target=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_OUTPUT"

      - name: Determine package version
        id: package
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | sed -n 's/.*"name":"locho","version":"\([^"]*\)".*/\1/p')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build packaged artifacts and installers
        run: >-
          dist build --artifacts=all
          --target=${{ steps.host.outputs.target }}
          --tag=v${{ steps.package.outputs.version }}

      - name: Check generated installers (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          grep -F "locho-${{ steps.host.outputs.target }}.tar.xz" target/distrib/sha256.sum
          sh -n target/distrib/locho-installer.sh
          LOCHO_NO_MODIFY_PATH=1 sh target/distrib/locho-installer.sh --help >/dev/null

      - name: Check generated installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Select-String -Path target\distrib\sha256.sum -Pattern "locho-${{ steps.host.outputs.target }}.zip" -Quiet)) {
            throw "Native archive is missing from sha256.sum"
          }
          .\target\distrib\locho-installer.ps1 -Help | Out-Null

      - name: Install generated shell installer (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          python3 -m http.server "$port" --directory target/distrib >/tmp/locho-artifact-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent "http://127.0.0.1:$port/sha256.sum" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/locho-artifact-server.log
              exit 1
            fi
            sleep 0.25
          done
          rm -rf target/installer-smoke
          LOCHO_DOWNLOAD_URL="http://127.0.0.1:$port" \
            LOCHO_UNMANAGED_INSTALL="$PWD/target/installer-smoke" \
            LOCHO_NO_MODIFY_PATH=1 \
            sh target/distrib/locho-installer.sh
          target/installer-smoke/locho --help >/dev/null

      - name: Install generated PowerShell installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $probe = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $probe.Start()
          $port = $probe.LocalEndpoint.Port
          $probe.Stop()
          $server = Start-Process python -ArgumentList '-m', 'http.server', $port, '--directory', 'target/distrib' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/sha256.sum" | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) {
              throw "Local artifact server did not become ready"
            }
            if (Test-Path -LiteralPath 'target/installer-smoke') {
              Remove-Item -LiteralPath 'target/installer-smoke' -Recurse -Force
            }
            $env:LOCHO_DOWNLOAD_URL = "http://127.0.0.1:$port"
            $env:LOCHO_UNMANAGED_INSTALL = "$PWD\target\installer-smoke"
            $env:LOCHO_NO_MODIFY_PATH = '1'
            .\target\distrib\locho-installer.ps1
            & .\target\installer-smoke\locho.exe --help | Out-Null
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Verify and extract packaged archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary=$(scripts/verify-release-artifact.sh \
            "target/distrib/locho-${{ steps.host.outputs.target }}.tar.xz" \
            target/artifact-smoke)
          echo "LOCHO_TEST_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Verify and extract packaged archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = & .\scripts\Verify-ReleaseArtifact.ps1 `
            -Archive "target/distrib/locho-${{ steps.host.outputs.target }}.zip" `
            -ExtractionDirectory "target/artifact-smoke"
          "LOCHO_TEST_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run artifact verifier negative tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/test-verify-release-artifact.sh

      - name: Run artifact verifier negative tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\Test-VerifyReleaseArtifact.ps1

      - name: Run packaged binary smoke test
        run: cargo test --test release_smoke -- --ignored

  dependency-security:
    name: Dependency security and policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}

      - name: Build cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Check dependencies
        # cargo-deny 0.20 configures unmaintained advisories by scope; this
        # keeps them visible without making the initial policy job fail.
        run: cargo deny check -W unmaintained
