[package]
name = "locho-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/trchopan/locho"
description = "Shared Locho protocol, capability validation, and relay settings"
publish = false

[features]
default = []
transport = ["dep:http", "dep:iroh", "dep:futures-util", "dep:tokio-util", "tokio/sync", "iroh/tls-ring"]
native-transport = ["transport", "iroh/default"]
web-transport = ["transport", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
n0-future = "0.3"
hex = "0.4"
futures-util = { version = "0.3", optional = true }
http = { version = "1", optional = true }
iroh = { version = "=1.2.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "time"] }
tokio-util = { version = "0.7", optional = true }
url = "2"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "test-util"] }
