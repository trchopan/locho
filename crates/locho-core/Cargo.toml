[package]
name = "locho-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/trchopan/locho"
description = "Shared Locho protocol, capability validation, and relay settings"
publish = false

[features]
default = []
transport = ["dep:http", "dep:iroh", "dep:url", "dep:futures-util", "dep:tokio-util", "tokio/sync"]

[dependencies]
anyhow = "1"
bytes = "1"
hex = "0.4"
futures-util = { version = "0.3", optional = true }
http = { version = "1", optional = true }
iroh = { version = "=1.2.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["io-util", "macros", "time"] }
tokio-util = { version = "0.7", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "test-util"] }
