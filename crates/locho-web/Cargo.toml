[package]
name = "locho-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/trchopan/locho"
description = "Browser WASM connectivity proof for Locho"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
locho-core = { path = "../locho-core", version = "0.1.0", features = ["web-transport"] }
http = "1"
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
n0-future = "0.3"
tokio = { version = "1", features = ["io-util", "sync", "macros"] }
tokio-util = "0.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_browser)'] }
