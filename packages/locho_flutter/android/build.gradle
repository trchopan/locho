// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.locho_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://github.com/rustls/rustls-platform-verifier/raw/maven-archive/android-release-support/maven/" }
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://github.com/rustls/rustls-platform-verifier/raw/maven-archive/android-release-support/maven/" }
    }
}

apply plugin: 'com.android.library'

repositories {
    maven { url "https://github.com/rustls/rustls-platform-verifier/raw/maven-archive/android-release-support/maven/" }
}
dependencies {
    // Must match rustls-platform-verifier-android in rust/Cargo.lock.
    implementation 'org.rustls:rustls-platform-verifier:0.2.0'
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.locho_flutter'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 23
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../rust"
    libname = "locho_flutter"
}
