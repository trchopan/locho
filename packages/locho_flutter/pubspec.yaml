name: locho_flutter
description: Foreground Locho TCP attachments for Flutter native applications.
version: 0.1.0-dev.1
publish_to: none
environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.5'
dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.chop.locho
        pluginClass: LochoFlutterPlugin
      ios:
        ffiPlugin: true
